[project]
name = "gpu-ssh-panel"
version = "0.1.0"
description = "A minimal local NiceGUI panel for project-centered GPU SSH workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "asyncssh>=2.14.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.uv]
package = false
