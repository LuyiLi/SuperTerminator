services:
  gpu-ssh-panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GPU_SSH_PANEL_HOST: 0.0.0.0
      GPU_SSH_PANEL_PORT: 8080
      GPU_SSH_PANEL_DB_PATH: /app/data/app.db
    volumes:
      - ../data:/app/data
      - ~/.ssh:/root/.ssh:ro
